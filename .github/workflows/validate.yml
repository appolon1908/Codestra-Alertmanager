name: Validate Codestra Alertmanager source authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codestra-alertmanager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify exact metadata bootstrap change
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "${{ github.event.before }}" =~ ^[0-9a-f]{40}$ && "${{ github.event.before }}" != '0000000000000000000000000000000000000000' ]]; then
            base_sha="${{ github.event.before }}"
          else
            echo 'CODESTRA_PENDING_UPSTREAM_SYNC=0' >> "$GITHUB_ENV"
            exit 0
          fi
          mapfile -d '' -t changed_paths < <(
            git diff --name-only -z "$base_sha" "$GITHUB_SHA"
          )
          if (( ${#changed_paths[@]} == 1 )) && [[ "${changed_paths[0]}" == CODESTRA_UPSTREAM.json ]]; then
            echo 'CODESTRA_PENDING_UPSTREAM_SYNC=1' >> "$GITHUB_ENV"
          else
            echo 'CODESTRA_PENDING_UPSTREAM_SYNC=0' >> "$GITHUB_ENV"
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install pinned parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Validate protected source controls
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-alertmanager-pycache
        run: |
          python -m py_compile scripts/validate_repository_security.py tests/test_repository_security.py
          python tests/test_repository_security.py
          python scripts/validate_repository_security.py

      - name: Bind vendored Git tree to deterministic transformed official commit
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t values < <(python - <<'PY'
          import json
          data = json.load(open('CODESTRA_UPSTREAM.json'))
          print(data['upstream_ref'])
          print(data['source_transform']['transformed_tree_oid'])
          lock = json.load(open('CODESTRA_UPSTREAM_LOCK.json'))
          print(lock['source_transform']['transformed_tree_oid'])
          PY
          )
          upstream_ref="${values[0]}"
          expected_tree="${values[1]}"
          lock_tree="${values[2]}"
          [[ "$upstream_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$lock_tree" =~ ^[0-9a-f]{40}$ ]]
          staging="$(mktemp -d)"
          trap 'rm -rf -- "$staging"' EXIT
          git init --quiet "$staging/source"
          git -C "$staging/source" remote add origin https://github.com/prometheus/alertmanager.git
          GIT_LFS_SKIP_SMUDGE=1 git -C "$staging/source" fetch --depth 1 --no-tags origin "$upstream_ref"
          git -C "$staging/source" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$staging/source" rev-parse HEAD)" == "$upstream_ref" ]]
          STAGING_SOURCE="$staging/source" python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['STAGING_SOURCE'])
          needle = b'https://hooks.slack.com/services/'
          replacement = b'https://hooks.slack.invalid/services/'
          expected_paths = {
              'config/config_test.go',
              'config/notifiers_test.go',
              'config/testdata/conf.slack-both-url-and-token.yml',
              'config/testdata/conf.slack-default-app-token.yml',
              'config/testdata/conf.slack-update-message-and-webhook.yml',
          }
          expected_occurrences = 6
          counts = {}
          for path in sorted(root.rglob('*')):
              if '.git' in path.parts or not path.is_file() or path.is_symlink():
                  continue
              data = path.read_bytes()
              count = data.count(needle)
              if count:
                  relative = path.relative_to(root).as_posix()
                  counts[relative] = count
                  path.write_bytes(data.replace(needle, replacement))
          if set(counts) != expected_paths:
              raise SystemExit(f'unexpected_sanitized_paths:{sorted(counts)}')
          if sum(counts.values()) != expected_occurrences:
              raise SystemExit(f'unexpected_sanitized_occurrences:{sum(counts.values())}')
          PY
          git -C "$staging/source" add -A
          transformed_tree="$(git -C "$staging/source" write-tree)"
          vendored_tree="$(git rev-parse 'HEAD:upstream')"
          [[ "$transformed_tree" == "$expected_tree" ]]
          vendored_expected_tree="$expected_tree"
          if [[ "${CODESTRA_PENDING_UPSTREAM_SYNC:-0}" == 1 ]]; then
            vendored_expected_tree="$lock_tree"
          fi
          [[ "$vendored_tree" == "$vendored_expected_tree" ]]

      - name: Reject control-plane secrets and whitespace errors
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/reject_repository_secrets.sh .
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "${{ github.event.before }}" =~ ^[0-9a-f]{40}$ && "${{ github.event.before }}" != '0000000000000000000000000000000000000000' ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          scripts/reject_repository_secrets.sh --git-range "$base_sha" "$GITHUB_SHA"
          git diff --check "$base_sha" "$GITHUB_SHA" -- . ':(exclude)upstream'
