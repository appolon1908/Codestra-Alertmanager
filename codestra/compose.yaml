name: codestra-alertmanager

services:
  alertmanager:
    image: quay.io/prometheus/alertmanager@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --web.config.file=/etc/alertmanager/web-config.yml
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-https://aler.codestra.media/}
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode,auto-gomemlimit,receiver-name-in-metrics
      - --silences.max-silences=5000
      - --silences.max-silence-size-bytes=65536
    expose:
      - "9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./web-config.yml:/etc/alertmanager/web-config.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - source: middleware_alert_webhook_url
        target: middleware-alert-webhook-url
        mode: 0400
      - source: middleware_alert_webhook_token
        target: middleware-alert-webhook-token
        mode: 0400
      - source: alertmanager_server_cert
        target: alertmanager-server-cert
        mode: 0444
      - source: alertmanager_server_key
        target: alertmanager-server-key
        mode: 0400
      - source: alertmanager_client_ca
        target: alertmanager-client-ca
        mode: 0444
    networks:
      observability:
        aliases:
          - alertmanager
      integration: {}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

networks:
  observability:
    external: true
    name: ${CODESTRA_OBSERVABILITY_NETWORK:-codestra-observability}
  integration:
    external: true
    name: ${CODESTRA_INTEGRATION_NETWORK:-codestra-integration}

volumes:
  alertmanager_data:

secrets:
  middleware_alert_webhook_url:
    external: true
    name: ${MIDDLEWARE_ALERT_WEBHOOK_URL_SECRET:-codestra-middleware-alert-webhook-url}
  middleware_alert_webhook_token:
    external: true
    name: ${MIDDLEWARE_ALERT_WEBHOOK_TOKEN_SECRET:-codestra-middleware-alert-webhook-token}
  alertmanager_server_cert:
    external: true
    name: ${ALERTMANAGER_SERVER_CERT_SECRET:-codestra-alertmanager-server-cert}
  alertmanager_server_key:
    external: true
    name: ${ALERTMANAGER_SERVER_KEY_SECRET:-codestra-alertmanager-server-key}
  alertmanager_client_ca:
    external: true
    name: ${ALERTMANAGER_CLIENT_CA_SECRET:-codestra-alertmanager-client-ca}
